name: Manter banco ativo

# O Supabase gratuito pausa o projeto depois de 7 dias sem uso.
# Este robo faz uma consulta a cada 3 dias para isso nao acontecer.
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js)
          echo "Consultando $URL"
          curl -sS -f "$URL/rest/v1/categorias?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo
          echo "Ok!"
